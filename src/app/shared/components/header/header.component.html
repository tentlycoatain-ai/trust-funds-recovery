<header class="header" [class.is-scrolled]="isScrolled()" [class.menu-open]="mobileMenuOpen()">
  <div class="container header-inner">
    <a routerLink="/" (click)="closeMobileMenu()" class="brand-logo" aria-label="Trust Funds Recovery Home">
      <img src="/assets/brand/tfr-logo-light.svg" alt="Trust Funds Recovery" />
    </a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Home</a></li>
        <li><a routerLink="/about" routerLinkActive="active" class="nav-link">About</a></li>
        <li><a routerLink="/services" routerLinkActive="active" class="nav-link">Services</a></li>
        <li><a routerLink="/how-it-works" routerLinkActive="active" class="nav-link">How it works</a></li>
        <li><a routerLink="/resources" routerLinkActive="active" class="nav-link">Resources</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" class="nav-link">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a routerLink="/contact" class="btn btn-primary btn-sm header-cta"><span>Request an assessment</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></a>
      <button type="button" class="mobile-toggle" [class.active]="mobileMenuOpen()" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()" aria-label="Toggle navigation menu"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
    </div>
  </div>
  <div class="mobile-drawer" [class.open]="mobileMenuOpen()">
    <div class="mobile-drawer-content">
      <nav class="mobile-nav" aria-label="Mobile navigation"><ul class="mobile-nav-list">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a></li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About</a></li>
        <li><a routerLink="/services" routerLinkActive="active" (click)="closeMobileMenu()">Services</a></li>
        <li><a routerLink="/how-it-works" routerLinkActive="active" (click)="closeMobileMenu()">How it works</a></li>
        <li><a routerLink="/resources" routerLinkActive="active" (click)="closeMobileMenu()">Resources</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a></li>
      </ul></nav>
      <div class="mobile-drawer-footer"><a routerLink="/contact" (click)="closeMobileMenu()" class="btn btn-gold btn-lg full-width">Request an assessment</a><p class="mobile-disclaimer">Confidential, measured, and transparent from the first conversation.</p></div>
    </div>
  </div>
</header>
