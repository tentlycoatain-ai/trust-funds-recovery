<div class="service-card" *ngIf="service">
  <!-- Icon & Header -->
    <div class="service-card-header">
      <div class="service-icon-box" [ngSwitch]="service.iconType">
        <app-visual-icon [icon]="service.iconType" [label]="service.title"></app-visual-icon>
      </div>

    <span class="service-target">{{ service.recommendedFor }}</span>
  </div>

  <h3 class="service-title">{{ service.title }}</h3>
  <p class="service-summary">{{ service.shortDesc }}</p>

  <!-- Scope Bullet Points -->
  <div class="service-scope">
    <span class="scope-label">Scope of Assistance:</span>
    <ul class="scope-list">
      <li *ngFor="let pt of service.scopePoints">
        <span class="bullet-dot"></span>
        <span>{{ pt }}</span>
      </li>
    </ul>
  </div>

  <!-- Card Action Footer -->
  <div class="service-card-footer" *ngIf="showCta">
    <a routerLink="/contact" [queryParams]="{ category: service.id }" class="service-action-link">
      <span>Inquire About This Service</span>
      <img class="real-icon real-icon-inline" src="/assets/icons/envelope-letter.png" alt="" aria-hidden="true" />
    </a>
  </div>
</div>
