<div class="testimonial-card" *ngIf="testimonial">
  <div class="card-top">
    <div class="category-tag">{{ testimonial.category }}</div>
    <span class="placeholder-notice" title="Design Placeholder strictly for client development">
      Client Scenario (Sample)
    </span>
  </div>

  <h4 class="scenario-title">{{ testimonial.scenarioTitle }}</h4>

  <div class="quote-body">
    <img class="real-icon real-icon-inline" src="/assets/icons/coin-stack.png" alt="" aria-hidden="true" />
    <p class="quote-text">“{{ testimonial.quote }}”</p>
  </div>

  <div class="client-meta">
    <div class="initials-avatar">
      {{ testimonial.clientInitials }}
    </div>
    <div class="client-info">
      <span class="client-name">Client {{ testimonial.clientInitials }}</span>
      <span class="client-loc">{{ testimonial.location }} • Privacy Protected</span>
    </div>
  </div>
</div>
