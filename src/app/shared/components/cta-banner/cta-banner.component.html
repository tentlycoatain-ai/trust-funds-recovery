<section class="cta-banner-section">
  <div class="container">
    <div class="cta-card">
      <div class="cta-content">
        <span class="badge badge-gold">{{ badge }}</span>
        <h2 class="cta-title">{{ title }}</h2>
        <p class="cta-description">{{ description }}</p>

        <div class="cta-actions">
          <a [routerLink]="primaryBtnLink" class="btn btn-gold btn-lg">
            <span>{{ primaryBtnText }}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>

          <a [routerLink]="secondaryBtnLink" class="btn btn-outline-white btn-lg">
            <span>{{ secondaryBtnText }}</span>
          </a>
        </div>

        <div class="cta-badges">
          <span class="badge-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            No Upfront Review Fees
          </span>
          <span class="badge-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Strict NDA Confidentiality
          </span>
          <span class="badge-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Clear Feasibility Report
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
