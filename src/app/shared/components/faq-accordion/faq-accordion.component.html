<div class="faq-accordion" role="region" aria-label="Frequently Asked Questions">
  <div 
    class="faq-item" 
    *ngFor="let item of items; let i = index" 
    [class.is-open]="isOpen(i)">
    
    <button 
      type="button" 
      class="faq-question" 
      (click)="toggle(i)" 
      [attr.aria-expanded]="isOpen(i)" 
      [attr.aria-controls]="'faq-answer-' + i"
      [id]="'faq-header-' + i">
      <span class="question-text">{{ item.question }}</span>
      <span class="icon-toggle" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </button>

    <div 
      class="faq-answer-wrapper" 
      [id]="'faq-answer-' + i" 
      role="region" 
      [attr.aria-labelledby]="'faq-header-' + i">
      <div class="faq-answer-inner">
        <p class="answer-text">{{ item.answer }}</p>
      </div>
    </div>
  </div>
</div>
